[project]
site_name = "Suffine Hub"
site_url = "https://sufine.top"
site_description = "知行合一，格物致知。"
site_author = "Luwei"
copyright = "Copyright &copy; 2026 Luwei"
docs_dir = "docs"
site_dir = "site"
edit_uri = "edit/main/docs/"
repo_url = "https://github.com/weigo6/suffine-hub"
repo_name = "weigo6/Sufine Hub"

extra_javascript = [
    #"javascripts/mathjax.js", # 加载 MathJax 配置脚本
    #"https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js", # 从 CDN 加载 MathJax 库
    "javascripts/feedback.js", # 页面反馈脚本
    "javascripts/katex.js", # 加载 katex 配置脚本
    "https://unpkg.com/katex@0/dist/katex.min.js", # 从 CDN 加载 katex 库
    "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
]

extra_css = [
    "stylesheets/extra.css", # 站点基础样式表
    "https://unpkg.com/katex@0/dist/katex.min.css", # KaTeX 样式表
]

# 站点导航在 docs/SUMMARY.md 中维护（literate-nav）。

# 站点生成器选项
[project.extra]
generator = false

# 页面状态配置
[project.extra.status]
new = "最近更新"
deprecated = "过时内容"

# Umami站点分析配置
[project.extra.analytics]
provider = "custom"
property = "foobar"
script_url = "https://cloud.umami.is/script.js"
website_id = "c53576ff-f759-4495-b8ec-bb653e56ce58"

# 页面反馈配置
[project.extra.analytics.feedback]
title = "此页面有帮助吗?"

[[project.extra.analytics.feedback.ratings]]
icon = "material/thumb-up-outline"
name = "此页面有帮助"
data = 1
note = "感谢您的反馈!"

[[project.extra.analytics.feedback.ratings]]
icon = "material/thumb-down-outline"
name = "此页面可以改进"
data = 0
note = """
  感谢您的反馈! 笔者将努力改进此页面
  </br>您可以使用<a href="/basic/contact-form/">反馈表单</a>来帮助我
"""

[project.theme]
variant = "modern"
#variant = "material"
language = "zh"
font.text = "Noto Sans"
font.code = "JetBrains Mono"
logo = "images/bird.webp"
favicon = "images/bird.webp"
custom_dir = "docs/overrides"
features = [
    #"navigation.instant", # 启用即时导航
    #"navigation.instant.prefetch", # 启用预加载
    "navigation.instant.progress", # 加载进度条
    #"navigation.tracking", # 滚动时URL锚点自动更新
    "navigation.tabs", # 一级导航显示为顶部Tab
    #"navigation.tabs.sticky", # 顶部Tab栏粘性显示
    "navigation.sections", # 启用侧边栏章节分组
    "navigation.path", # URL路径导航
    "navigation.indexes", # 导航索引
    "navigation.top", # 返回顶部按钮
    "toc.follow", # 目录跟随滚动
    "search.highlight", # 搜索结果高亮显示
    "content.action.edit", # 编辑此页按钮
    "content.action.view",  # 浏览页面源码按钮
    "navigation.footer", # 启用页脚导航
    "content.code.copy", # 代码块复制按钮
    "content.code.select", # 代码块选择按钮
    "content.code.annotate", # 代码块注释按钮
    "content.footnote.tooltips", # 脚注提示
    "content.tooltips" # 启用内容工具提示
]

# 主题图标配置
[project.theme.icon]
previous = "lucide/arrow-left"
next = "lucide/arrow-right"
repo = "fontawesome/brands/github"
edit = "material/pencil"
view = "material/eye"

# 主题调色板配置
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"
primary = "indigo"
accent = "indigo"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"
primary = "deep purple"
accent = "orange"

# 导航插件配置
[project.plugins.literate-nav]
nav_file = "SUMMARY.md"

# 搜索插件配置
[project.plugins.search]
separator = '[\s\-\.]+'  # 中文优化：'[\s\u200b\-]'

# 标签插件配置
[project.plugins.tags]

# glightbox插件配置
[project.plugins.glightbox]

# 提示块插件配置
[project.plugins.callouts]

# minify插件配置
[project.plugins.minify]
minify_js = true
minify_css = true
cache_safe = true
js_files = [
    "javascripts/feedback.js",
    "javascripts/katex.js",
]
css_files = [
    "stylesheets/extra.css",
]

# 社交链接配置
[[project.extra.social]]
icon = "fontawesome/brands/weixin"
link = "https://cdn.009420.xyz/wechat.webp"
name = "关注微信公众号"

[[project.extra.social]]
icon = "fontawesome/brands/discord"
link = "https://discord.gg/fSvCWA9say"
name = "加入 Discord 服务器"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/weigo6"
name = "访问 GitHub 主页"

[[project.extra.social]]
icon = "simple/gitee"
link = "https://gitee.com/weigo6"
name = "访问 Gitee 主页"

[[project.extra.social]]
icon = "fontawesome/brands/bilibili"
link = "https://space.bilibili.com/512710834"
name = "访问 Bilibili 主页"

[[project.extra.social]]
icon = "simple/gmail"
link = "mailto:yang92636@qq.com"
name = "通过电子邮件联系我"

# 允许您通过用 abbr 标签包裹元素来为其添加简短的工具提示
[project.markdown_extensions.abbr]
# 警告框支持
[project.markdown_extensions.admonition]
# 属性列表支持
[project.markdown_extensions.attr_list]
# 定义列表支持
[project.markdown_extensions.def_list]
# 脚注支持
[project.markdown_extensions.footnotes]
# 允许在 HTML 内容中使用 Markdown 语法
[project.markdown_extensions.md_in_html]
# 目录支持
[project.markdown_extensions.toc]
permalink =  true
title = "目录"
permalink_title = "跳转至本节的锚点链接"
toc_depth = 5 #目录层级
# 表格支持
[project.markdown_extensions.tables]
# 数学公式支持
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
# 为任何 Markdown 代码块（包括图片、表格和代码块）添加标题
[project.markdown_extensions.pymdownx.blocks.caption]
# 高亮显示文本及简单语法实现上下标
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.tilde]
# 增强了 Admonition 扩展程序的功能，使详情块可折叠
[project.markdown_extensions.pymdownx.details]
# 将图标和表情符号 *.svg 文件格式内联到生成的 HTML 页面中
[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji" 
emoji_generator = "zensical.extensions.emoji.to_svg"
# 代码块语法高亮
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
pygments_lang_class = true
auto_title = true
linenums = true
linenums_style = "pymdownx-inline"
line_spans = "__span"
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
# 行内代码高亮
[project.markdown_extensions.pymdownx.inlinehilite]
# 键盘按键样式，允许渲染键盘按键和组合键
[project.markdown_extensions.pymdownx.keys]
# 将某些字符序列转换为相应的符号，例如版权符号或分数
[project.markdown_extensions.pymdownx.smartsymbols]
# 允许使用简单的语法将任意文件中的内容嵌入到文档中，包括其他文档或源文件
[project.markdown_extensions.pymdownx.snippets]
# 允许使用内容标签页
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
# 任务列表支持
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true