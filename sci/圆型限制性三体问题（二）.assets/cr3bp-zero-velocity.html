      &lt;input id=&quot;cr3bp-c-slider&quot; class=&quot;form-range&quot; type=&quot;range&quot; min=&quot;2.60&quot; max=&quot;4.50&quot; step=&quot;0.005&quot; value=&quot;3.75&quot; aria-describedby=&quot;cr3bp-stage&quot;&gt;

    &lt;span&gt;&lt;i class=&quot;cr3bp-key cr3bp-key-forbidden&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;禁区：2Υ − C &amp;lt; 0&lt;/span&gt;
    &lt;span&gt;&lt;i class=&quot;cr3bp-key cr3bp-key-boundary&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;零速度边界：2Υ = C&lt;/span&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;cr3bp-zero-velocity&#x27;);
  const canvas = document.getElementById(&#x27;cr3bp-canvas&#x27;);
  const slider = document.getElementById(&#x27;cr3bp-c-slider&#x27;);
  const valueOut = document.getElementById(&#x27;cr3bp-c-value&#x27;);
  const stageOut = document.getElementById(&#x27;cr3bp-stage&#x27;);
  const ctx = canvas.getContext(&#x27;2d&#x27;);
  const mu = 0.5;
  const points = [
    { name: &#x27;L₁&#x27;, x: 0, y: 0, c: 4.0 },
    { name: &#x27;L₂&#x27;, x: 1.198406, y: 0, c: 3.456796 },
    { name: &#x27;L₃&#x27;, x: -1.198406, y: 0, c: 3.456796 },
    { name: &#x27;L₄&#x27;, x: 0, y: Math.sqrt(3) / 2, c: 2.75 },
    { name: &#x27;L₅&#x27;, x: 0, y: -Math.sqrt(3) / 2, c: 2.75 }
  ];
  const domain = { xmin: -2, xmax: 2, ymin: -1.45, ymax: 1.45 };
  let css = {};

  function resolveCssColor(value) {
    const probe = document.createElement(&#x27;span&#x27;);
    probe.style.color = value;
    probe.style.display = &#x27;none&#x27;;
    root.appendChild(probe);
    const color = getComputedStyle(probe).color;
    probe.remove();
    return color;
  }

  function themeColors() {
    const s = getComputedStyle(root);
    css = {
      fg: resolveCssColor(s.getPropertyValue(&#x27;--foreground&#x27;).trim()),
      muted: resolveCssColor(s.getPropertyValue(&#x27;--muted&#x27;).trim()),
      mutedFg: resolveCssColor(s.getPropertyValue(&#x27;--muted-foreground&#x27;).trim()),
      border: resolveCssColor(s.getPropertyValue(&#x27;--border&#x27;).trim()),
      allowed: resolveCssColor(s.getPropertyValue(&#x27;--viz-series-1&#x27;).trim()),
      boundary: resolveCssColor(s.getPropertyValue(&#x27;--viz-series-2&#x27;).trim()),
      primary: resolveCssColor(s.getPropertyValue(&#x27;--viz-series-3&#x27;).trim())
    };
  }

  function omega2(x, y) {
    const d = Math.hypot(x + mu, y);
    const r = Math.hypot(x - 1 + mu, y);
    if (d &lt; 0.006 || r &lt; 0.006) return 1e6;
    return x * x + y * y + 2 * (1 - mu) / d + 2 * mu / r;
  }

  function stageText(c) {
    if (c &gt; 4.0) return &#x27;两个主天体附近彼此隔离；L₁ 通道尚未打开。&#x27;;
    if (c &gt; 3.456796) return &#x27;L₁ 通道已打开：两个主天体附近可以连通。&#x27;;
    if (c &gt; 2.75) return &#x27;L₂、L₃ 外部通道也已打开：内部与外部可以连通。&#x27;;
    return &#x27;在 xy 平面内，零速度禁区已经消失。&#x27;;
  }

  function hexToRgba(color, alpha) {
    const probe = document.createElement(&#x27;span&#x27;);
    probe.style.color = color;
    probe.style.display = &#x27;none&#x27;;
    root.appendChild(probe);
    const rgb = getComputedStyle(probe).color.match(/[\d.]+/g).slice(0, 3).map(Number);
    probe.remove();
    return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${alpha})`;
  }

  function draw() {
    themeColors();
    const c = Number(slider.value);
    valueOut.textContent = c.toFixed(3);
    stageOut.textContent = stageText(c);

    const width = Math.max(320, Math.round(root.getBoundingClientRect().width));
    const height = Math.round(width * 0.68);
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.aspectRatio = `${width} / ${height}`;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const margin = { left: width &lt; 440 ? 42 : 54, right: 18, top: 14, bottom: 38 };
    const pw = width - margin.left - margin.right;
    const ph = height - margin.top - margin.bottom;
    const xpx = x =&gt; margin.left + (x - domain.xmin) / (domain.xmax - domain.xmin) * pw;
    const ypx = y =&gt; margin.top + (domain.ymax - y) / (domain.ymax - domain.ymin) * ph;

    ctx.clearRect(0, 0, width, height);
    ctx.fillStyle = hexToRgba(css.allowed, 0.16);
    ctx.fillRect(margin.left, margin.top, pw, ph);

    const step = width &lt; 440 ? 3 : 2;
    const values = [];
    for (let py = margin.top; py &lt; margin.top + ph; py += step) {
      const row = [];
      const y = domain.ymax - (py - margin.top) / ph * (domain.ymax - domain.ymin);
      for (let px = margin.left; px &lt; margin.left + pw; px += step) {
        const x = domain.xmin + (px - margin.left) / pw * (domain.xmax - domain.xmin);
        const q = omega2(x, y) - c;
        row.push(q);
        if (q &lt; 0) {
          ctx.fillStyle = css.muted;
          ctx.fillRect(px, py, step + 0.5, step + 0.5);
        }
      }
      values.push(row);
    }

    ctx.strokeStyle = css.boundary;
    ctx.lineWidth = 1.7;
    ctx.beginPath();
    for (let j = 0; j &lt; values.length - 1; j++) {
      for (let i = 0; i &lt; values[j].length - 1; i++) {
        const q = values[j][i];
        if ((q &gt;= 0) !== (values[j][i + 1] &gt;= 0) || (q &gt;= 0) !== (values[j + 1][i] &gt;= 0)) {
          const px = margin.left + i * step;
          const py = margin.top + j * step;
          ctx.moveTo(px, py);
          ctx.lineTo(px + step, py + step);
        }
      }
    }
    ctx.stroke();

    ctx.strokeStyle = css.border;
    ctx.lineWidth = 1;
    ctx.strokeRect(margin.left, margin.top, pw, ph);
    ctx.beginPath();
    ctx.moveTo(xpx(0), margin.top);
    ctx.lineTo(xpx(0), margin.top + ph);
    ctx.moveTo(margin.left, ypx(0));
    ctx.lineTo(margin.left + pw, ypx(0));
    ctx.stroke();

    ctx.fillStyle = css.mutedFg;
    ctx.font = &#x27;12px system-ui, sans-serif&#x27;;
    ctx.textAlign = &#x27;center&#x27;;
    [-2, -1, 0, 1, 2].forEach(x =&gt; ctx.fillText(String(x), xpx(x), margin.top + ph + 19));
    ctx.fillText(&#x27;x（无量纲）&#x27;, margin.left + pw / 2, height - 5);
    ctx.textAlign = &#x27;right&#x27;;
    [-1, 0, 1].forEach(y =&gt; ctx.fillText(String(y), margin.left - 8, ypx(y) + 4));
    ctx.save();
    ctx.translate(13, margin.top + ph / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.textAlign = &#x27;center&#x27;;
    ctx.fillText(&#x27;y（无量纲）&#x27;, 0, 0);
    ctx.restore();

    const primaries = [{ name: &#x27;P₁&#x27;, x: -0.5 }, { name: &#x27;P₂&#x27;, x: 0.5 }];
    primaries.forEach(p =&gt; {
      ctx.beginPath();
      ctx.fillStyle = css.primary;
      ctx.arc(xpx(p.x), ypx(0), 5, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = css.fg;
      ctx.textAlign = &#x27;center&#x27;;
      ctx.fillText(p.name, xpx(p.x), ypx(0) + 20);
    });

    points.forEach((p, index) =&gt; {
      ctx.beginPath();
      ctx.fillStyle = css.boundary;
      ctx.arc(xpx(p.x), ypx(p.y), 3.2, 0, 2 * Math.PI);
      ctx.fill();
      ctx.fillStyle = css.fg;
      ctx.textAlign = p.x &lt; -1 ? &#x27;right&#x27; : p.x &gt; 1 ? &#x27;left&#x27; : &#x27;left&#x27;;
      const dx = p.x &lt; -1 ? -7 : 7;
      const dy = index === 0 ? 15 : p.y &gt; 0 ? -7 : p.y &lt; 0 ? 15 : -7;
      ctx.fillText(p.name, xpx(p.x) + dx, ypx(p.y) + dy);
    });
  }

  let drawFrame = 0;

  function scheduleDraw() {
    cancelAnimationFrame(drawFrame);
    drawFrame = requestAnimationFrame(draw);
  }

  slider.addEventListener(&#x27;input&#x27;, scheduleDraw);
  new ResizeObserver(scheduleDraw).observe(root);

  const colorScheme = matchMedia(&#x27;(prefers-color-scheme: dark)&#x27;);
  colorScheme.addEventListener(&#x27;change&#x27;, scheduleDraw);

  new MutationObserver(scheduleDraw).observe(document.documentElement, { attributes: true, attributeFilter: [&#x27;class&#x27;, &#x27;data-theme&#x27;] });
  draw();
})();
&lt;/script&gt;
