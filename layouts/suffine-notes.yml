      {%- set ns = namespace(tokens=[], pending="", group=false, lines=[], current="", units=0, weight=0) -%}
      {%- for c in t -%}
        {%- if c in "（(" and not ns.group -%}
          {%- if ns.pending -%}{%- set ns.tokens = ns.tokens + [ns.pending] -%}{%- endif -%}
          {%- set ns.pending = c -%}{%- set ns.group = true -%}
        {%- elif ns.group -%}
          {%- set ns.pending = ns.pending + c -%}
          {%- if c in "）)" -%}
            {%- set ns.tokens = ns.tokens + [ns.pending] -%}
            {%- set ns.pending = "" -%}{%- set ns.group = false -%}
          {%- endif -%}
