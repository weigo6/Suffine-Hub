        {%- else -%}
          {%- set split.tokens = split.tokens + [token] -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for token in split.tokens -%}
        {%- set ns.weight = 0 -%}
        {%- for c in token -%}
          {%- set ns.weight = ns.weight + ascii_widths.get(c, 2) -%}
        {%- endfor -%}
        {%- if ns.units + ns.weight > limit and ns.current|trim -%}
          {%- set ns.lines = ns.lines + [ns.current|trim] -%}
          {%- set ns.current = "" -%}{%- set ns.units = 0 -%}
        {%- endif -%}
        {%- if ns.current or token|trim -%}
          {%- set ns.current = ns.current + token -%}
          {%- set ns.units = ns.units + ns.weight -%}
        {%- endif -%}
      {%- endfor -%}
      {%- if ns.current|trim -%}{%- set ns.lines = ns.lines + [ns.current|trim] -%}{%- endif -%}
      {%- if not fit.selected -%}
        {%- set fit.lines = ns.lines -%}{%- set fit.tier = tier_index -%}
        {%- if ns.lines|length <= 3 -%}{%- set fit.selected = true -%}{%- endif -%}
      {%- endif -%}
      {%- endfor -%}
      {%- if fit.tier == 0 -%}{{ fit.lines[0] if fit.lines|length > 0 else "" }}{%- endif -%}
    color: '{{ layout.color or "#24231f" }}'
    align: start top
    font:
      family: '{{ layout.font_family or "Noto Sans SC" }}'
      style: Bold
