# Suffine Hub · Notes — native Zensical social layout (1200 × 630).
# Warm paper, ink typography, vermilion rules. Background is editable SVG.
# Title automatically selects the largest of four sizes fitting three rows.
# Latin advances are measured from Noto Sans SC Bold, with a small safety margin.
# Explicit rows handle Chinese titles while preserving Latin words and brackets.
# Page overrides: title, description, category, color, logo, signature,
# panel_image, site_label, background_image, brand_image and font_family.
definitions: []
tags:
  og:type: website
  og:site_name: '{{ config.site_name }}'
  og:title: '{% if page.is_homepage %}{{ config.site_name }}{% else %}{{ layout.title or page.meta.get("title",
    page.title) }} - {{ config.site_name }}{% endif %}'
  og:description: '{{ layout.description or page.meta.get("description", config.site_description) | x }}'
  og:image: '{{ image.url }}'
  og:image:type: '{{ image.type }}'
  og:image:width: '{{ image.width }}'
  og:image:height: '{{ image.height }}'
  og:url: '{{ page.canonical_url }}'
  twitter:card: summary_large_image
  twitter:title: '{% if page.is_homepage %}{{ config.site_name }}{% else %}{{ layout.title or page.meta.get("title",
    page.title) }} - {{ config.site_name }}{% endif %}'
  twitter:description: '{{ layout.description or page.meta.get("description", config.site_description) | x }}'
  twitter:image: '{{ image.url }}'
size:
  width: 1200
  height: 630
layers:
- background:
    image: '{{ layout.background_image or "layouts/assets/suffine-notes.svg" }}'
- size:
    width: 40
    height: 40
  offset:
    x: 64
    y: 54
  background:
    image: '{{ layout.logo or (config.docs_dir ~ "/" ~ config.theme.logo) }}'
- size:
    width: 188
    height: 34
  offset:
    x: 124
    y: 57
  background:
    image: '{{ layout.brand_image or "layouts/assets/suffine-wordmark.svg" }}'
- size:
    width: 296
    height: 31
  offset:
    x: 840
    y: 59
  typography:
    content: '{{ (page.meta.get("tags") or []) | join(" · ") }}'
    color: '#6b675f'
    align: end top
    font:
      family: '{{ layout.font_family or "Noto Sans SC" }}'
      style: Medium
- size:
    width: 730
    height: 35
  offset:
    x: 84
    y: 152
  typography:
    content: '{%- if layout.category -%}{{ layout.category }}{%- elif ''/sci/'' in page.canonical_url -%}科学探索{%-
      elif ''/tech-dev/'' in page.canonical_url -%}技术开发{%- elif ''/college-study/'' in page.canonical_url -%}课程学习{%-
      elif ''/blog/'' in page.canonical_url -%}随笔记录{%- elif page.is_homepage -%}知识 · 实践 · 探索{%- else -%}知识与实践{%-
      endif -%}'
    color: '#a83b2b'
    align: start top
    font:
      family: '{{ layout.font_family or "Noto Sans SC" }}'
      style: Medium
- size:
    width: 336
    height: 340
  offset:
    x: 838
    y: 156
  background:
    image: '{{ layout.panel_image or "layouts/assets/suffine-globe.svg" }}'
- size:
    width: 754
    height: 96
  offset:
    x: 62
    y: 203
  typography:
